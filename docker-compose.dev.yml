# Local development overlay: build the image from this checkout instead of
# pulling from GHCR, and expose Postgres to the host.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: dev
    image: riffle-accounting:dev

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: dev
    image: riffle-accounting:dev
