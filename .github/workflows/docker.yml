# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Build, smoke test, scan, and publish the Riffle image to GHCR.
#
# Order matters: the image is only pushed after it passes the smoke test and
# the vulnerability scan.
#
# Actions are pinned to full commit SHAs (the trailing comment is the release).
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build, test, scan, publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Fork PRs get a read-only token and cannot push, so they build and test only.
      - name: Decide whether to publish
        id: publish
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.publish.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # 1. Build a single-arch image into the local Docker daemon for testing.
      - name: Build image for testing (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: riffle-accounting:test
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=docker
          cache-to: type=gha,scope=docker,mode=max

      # 2. Run the full stack from that image and check it.
      - name: Smoke test
        run: bash scripts/smoke.sh riffle-accounting:test

      # 3. Fail on fixable CRITICAL vulnerabilities.
      #    Pinned to the commit of the immutable v0.36.0 release.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: riffle-accounting:test
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # 4. Publish multi-arch with SBOM and provenance. Layers are cached from
      #    step 1, so only the arm64 build does new work.
      - name: Build and push (linux/amd64, linux/arm64)
        if: steps.publish.outputs.push == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=docker
          cache-to: type=gha,scope=docker,mode=max
          provenance: mode=max
          sbom: true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Image"
            echo "Published: \`${{ steps.publish.outputs.push }}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
