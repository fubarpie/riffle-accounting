# SPDX-License-Identifier: AGPL-3.0-or-later
# Deployment stack: PostgreSQL + Riffle API/web + Riffle worker.
#
#   cp env.example .env     # then set POSTGRES_PASSWORD and RIFFLE_APP_DB_PASSWORD
#   docker compose up -d
#
# The image comes from GHCR by default. Override RIFFLE_IMAGE in .env to pin a
# version, or use docker-compose.dev.yml to build from local source.

name: riffle

x-riffle-env: &riffle-env
  # Runtime connections use the restricted riffle_app role (subject to row-level security).
  DATABASE_URL: postgres://riffle_app:${RIFFLE_APP_DB_PASSWORD:?Set RIFFLE_APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-riffle}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riffle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-riffle}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${RIFFLE_IMAGE:-ghcr.io/fubarpie/riffle-accounting:latest}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *riffle-env
      MODE: api
      PORT: "3000"
      # Only the API holds the owner credentials: it applies migrations at start-up.
      MIGRATE_DATABASE_URL: postgres://${POSTGRES_USER:-riffle}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-riffle}
      APP_DB_PASSWORD: ${RIFFLE_APP_DB_PASSWORD}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      # Encrypts SimpleFIN Access URLs. Optional until bank import is used; the
      # worker needs the same key ring to decrypt them.
      RIFFLE_SECRET_KEY: ${RIFFLE_SECRET_KEY:-}
      BANK_IMPORT_MIN_INTERVAL_SECONDS: ${BANK_IMPORT_MIN_INTERVAL_SECONDS:-}
      # Statement vault: uploaded statements live on the riffle-statements volume.
      STATEMENT_STORAGE_DIR: ${STATEMENT_STORAGE_DIR:-/data/statements}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-}
      # AI statement upload (PDF text). Leave EXTRACTOR empty to disable; CSV needs none of these.
      EXTRACTOR: ${EXTRACTOR:-}
      EXTRACTOR_BASE_URL: ${EXTRACTOR_BASE_URL:-}
      EXTRACTOR_API_KEY: ${EXTRACTOR_API_KEY:-}
      EXTRACTOR_MODEL: ${EXTRACTOR_MODEL:-}
    ports:
      - "${RIFFLE_PORT:-3000}:3000"
    volumes:
      - riffle-data:/data
      - riffle-statements:/data/statements

  worker:
    image: ${RIFFLE_IMAGE:-ghcr.io/fubarpie/riffle-accounting:latest}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *riffle-env
      MODE: worker
      PORT: "3001"
      # Same key ring as the api. With it set (and DATABASE_URL) the worker runs
      # the daily SimpleFIN import; see docs/worker-import.md.
      RIFFLE_SECRET_KEY: ${RIFFLE_SECRET_KEY:-}
      RIFFLE_IMPORT_ENABLED: ${RIFFLE_IMPORT_ENABLED:-}
      RIFFLE_IMPORT_INTERVAL_SECONDS: ${RIFFLE_IMPORT_INTERVAL_SECONDS:-}
      RIFFLE_IMPORT_CONCURRENCY: ${RIFFLE_IMPORT_CONCURRENCY:-}
      RIFFLE_IMPORT_RETRY_MINUTES: ${RIFFLE_IMPORT_RETRY_MINUTES:-}
    volumes:
      - riffle-data:/data

volumes:
  pgdata:
  riffle-data:
  riffle-statements:
